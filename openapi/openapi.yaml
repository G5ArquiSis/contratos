    StrategyConfig-Input:
      properties:
        priceMode:
          type: string
          enum:
          - fixed
          - market_fraction
          title: Pricemode
          default: market_fraction
        pricePerEnergy:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          - type: 'null'
          title: Priceperenergy
        priceFactor:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: string
          title: Pricefactor
          default: '0.5'
        offerQuantity:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Offerquantity
        bidAcceptancePolicy:
          type: string
          enum:
          - arrival_order
          - largest_quantity_first
          title: Bidacceptancepolicy
          default: arrival_order
        buyWaitSpanSeconds:
          type: integer
          minimum: 0.0
          title: Buywaitspanseconds
          default: 60
        offerSelectionPolicy:
          type: string
          enum:
          - lowest_effective_price
          - lowest_nominal_price
          title: Offerselectionpolicy
          default: lowest_effective_price
      additionalProperties: false
      type: object
      title: StrategyConfig
      description: |-
        Parámetros efectivos de una estrategia para un ciclo.

        En modo ``market_fraction``, el precio se calcula con la fórmula:

        ``buybackPrice + price_factor * (imbalancePrice - buybackPrice)``.

        ``offer_quantity=None`` significa ofrecer todo el ``sellable`` disponible.
        ``buy_wait_span_seconds`` es el tiempo que el comprador espera una respuesta
        antes de reintentar o pasar a otra oferta.
