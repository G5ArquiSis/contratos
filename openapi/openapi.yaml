openapi: 3.1.0
info:
  title: EnergyShark E2 API
  version: 2.0.0
  description: |
    API HTTP pública del nodo de Talca (TAL). La interfaz la consume solo a través de API
    Gateway (`https://api.melchort.me`), que exige un JWT de Auth0 y agrega los headers CORS.

    - RF01: `/cycles` y `/cycles/{cycle_id}`
    - RF02: `/connectivity`
    - RF04: `/negotiations`
    - RF05: `/message-log`
    - E0: `/history`

    Los endpoints `/internal/*` (contrato entre connector y master) quedan fuera de este archivo:
    están documentados en `backend/docs/ciclo-negociacion.md` y Nginx los bloquea.

    Archivo generado con `backend/scripts/exportar_openapi.py`; no se edita a mano.
paths:
  /health:
    get:
      tags:
      - health
      summary: Estado del servicio
      description: |-
        Responde 200 solo si el servicio puede hablar con Postgres.

        No consulta al broker a propósito: master debe seguir reportándose sano y
        atendiendo el historial aunque RabbitMQ esté caído (RNF1).
      operationId: read_health_health_get
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Read Health Health Get
      security: []
  /history:
    get:
      tags:
      - history
      summary: Historial de demand-set de la E0, paginado y filtrable
      description: |-
        Historial paginado y filtrable (RF1, RF3, RF4).

        Ambos modelos se declaran con Depends() y no con Query(): FastAPI expande un
        solo modelo Query() por endpoint, y con dos dejaría de publicar `page`,
        `limit` y los filtros como parámetros sueltos.
      operationId: list_history_history_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      - name: idpk
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idpk
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
      - name: receivedAt
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Receivedat
      - name: validUntil
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Validuntil
      - name: city
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: City
      - name: unit
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHistory'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
  /history/{event_id}:
    get:
      tags:
      - history
      summary: Detalle de un evento demand-set de la E0
      description: |-
        Detalle de un evento por el id generado por el sistema (RF2).

        Responde 404 si el id no existe.
      operationId: read_history_entry_history__event_id__get
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
          title: Event Id
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandEventOut'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
        '404':
          description: Evento no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /negotiations:
    post:
      tags:
      - negotiations
      summary: 'Retirado en el protocolo v3: siempre responde 410'
      description: El protocolo v3 retira la creación HTTP de negociaciones E1.
      operationId: propose_negotiation_negotiations_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NegotiationIn'
      responses:
        '410':
          description: 'Siempre: negotiation-proposal está retirado en el protocolo v3'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
    get:
      tags:
      - negotiations
      summary: Historial de negociaciones (RF04)
      description: 'Historial de negociaciones con su estado: pending, confirmed, paid, expired o rejected.'
      operationId: list_negotiation_history_negotiations_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NegotiationOut'
                title: Response List Negotiation History Negotiations Get
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
  /negotiations/{negotiation_id}:
    get:
      tags:
      - negotiations
      summary: Detalle de una negociación (RF04)
      operationId: read_negotiation_negotiations__negotiation_id__get
      parameters:
      - name: negotiation_id
        in: path
        required: true
        schema:
          type: integer
          title: Negotiation Id
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NegotiationOut'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
        '404':
          description: Negociación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /cycles:
    get:
      tags:
      - negotiations
      summary: Ciclos con su balance y el presupuesto actual (RF01)
      description: Ciclos del más reciente al más antiguo, con su balance y el presupuesto actual.
      operationId: list_cycle_ledger_cycles_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleList'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
  /cycles/{cycle_id}:
    get:
      tags:
      - negotiations
      summary: Historial completo de un ciclo (RF01)
      description: |-
        Historial de un ciclo (RF01): lo recibido, lo negociado, lo reportado y los balances.

        `operations` trae todo en el orden en que se aplicó; la última lleva
        `isLast: true`, y su idpk se repite en `lastOperationIdpk`.
      operationId: read_cycle_cycles__cycle_id__get
      parameters:
      - name: cycle_id
        in: path
        required: true
        schema:
          type: string
          title: Cycle Id
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleDetail'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
        '404':
          description: Ciclo no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /connectivity:
    get:
      tags:
      - negotiations
      summary: Distance-table vigente (RF02)
      description: |-
        La distance-table vigente (RF02): destino, distancia, costo de transporte y estado.

        Refleja la última que publicó la central. Antes de la primera, responde una
        lista vacía en vez de 404: la interfaz muestra "sin datos", no un error.
      operationId: read_connectivity_connectivity_get
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connectivity'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
  /message-log:
    get:
      tags:
      - negotiations
      summary: Mensajes duplicados, descartados o con NACK (RF05)
      description: Mensajes duplicados, descartados y respondidos con NACK (RF05), paginados.
      operationId: list_unapplied_messages_message_log_get
      parameters:
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - duplicate
            - discarded
            - nack
            type: string
          - type: 'null'
          description: Filtra por tipo de registro
          title: Category
        description: Filtra por tipo de registro
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageLogPage'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
  /wallet/balance-status:
    get:
      tags:
      - negotiations
      summary: Balance oficial de la wallet y su conciliación (AD5)
      description: |-
        este endpoint entrega el ultimo balance oficial sincronizado y el delta detectado.
        decision (AD5).
      operationId: wallet_balance_status_wallet_balance_status_get
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema: {}
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
components:
  schemas:
    Connection:
      properties:
        destination:
          type: string
          title: Destination
        distance:
          anyOf:
          - type: number
          - type: 'null'
          title: Distance
        transportCost:
          anyOf:
          - type: number
          - type: 'null'
          title: Transportcost
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
      type: object
      required:
      - destination
      - distance
      - transportCost
      - enabled
      title: Connection
      description: Ruta hacia otra ciudad, según la distance-table vigente.
    Connectivity:
      properties:
        updatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updatedat
        connections:
          items:
            $ref: '#/components/schemas/Connection'
          type: array
          title: Connections
      type: object
      required:
      - updatedAt
      - connections
      title: Connectivity
      description: La distance-table vigente; `updatedAt` es nulo si la central aún no envió ninguna.
    CycleBalances:
      properties:
        energy:
          type: string
          title: Energy
        budget:
          type: string
          title: Budget
      type: object
      required:
      - energy
      - budget
      title: CycleBalances
      description: 'Balances finales del ciclo: la energía es propia; el presupuesto viene acumulado.'
    CycleDetail:
      properties:
        cycleId:
          type: string
          title: Cycleid
        opened:
          type: boolean
          title: Opened
        validUntil:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Validuntil
        statusStatement:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Statusstatement
        transfers:
          items:
            $ref: '#/components/schemas/LedgerEventOut'
          type: array
          title: Transfers
        demandStatements:
          items:
            $ref: '#/components/schemas/LedgerEventOut'
          type: array
          title: Demandstatements
        negotiations:
          items:
            $ref: '#/components/schemas/NegotiationOut'
          type: array
          title: Negotiations
        report:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Report
        reportSentAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Reportsentat
        reportQueuedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Reportqueuedat
        reportError:
          anyOf:
          - type: string
          - type: 'null'
          title: Reporterror
        balances:
          $ref: '#/components/schemas/CycleBalances'
        lastOperationIdpk:
          anyOf:
          - type: string
          - type: 'null'
          title: Lastoperationidpk
        operations:
          items:
            $ref: '#/components/schemas/LedgerEventOut'
          type: array
          title: Operations
        walletEvents:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Walletevents
        walletStatement:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Walletstatement
        marketMessages:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Marketmessages
        reconciliation:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Reconciliation
        swaps:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Swaps
        distanceTable:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Distancetable
      type: object
      required:
      - cycleId
      - opened
      - validUntil
      - statusStatement
      - transfers
      - demandStatements
      - negotiations
      - report
      - reportSentAt
      - reportError
      - balances
      - lastOperationIdpk
      - operations
      title: CycleDetail
      description: |-
        Todo lo que pasó en un ciclo, en un solo documento (RF01).

        ahora se incluyen los eventos de wallet, los asientos oficiales, los mensajes de mercado
        y la reconciliación, para que sean mostrados en la vista del detalle del ciclo.
    CycleList:
      properties:
        budgetBalance:
          type: string
          title: Budgetbalance
        items:
          items:
            $ref: '#/components/schemas/CycleOut'
          type: array
          title: Items
      type: object
      required:
      - budgetBalance
      - items
      title: CycleList
      description: Últimos ciclos y el presupuesto actual, que se traspasa de un ciclo a otro.
    CycleOut:
      properties:
        cycleId:
          type: string
          title: Cycleid
        opened:
          type: boolean
          title: Opened
        generationCapacity:
          anyOf:
          - type: string
          - type: 'null'
          title: Generationcapacity
        consumption:
          anyOf:
          - type: string
          - type: 'null'
          title: Consumption
        generationCost:
          anyOf:
          - type: string
          - type: 'null'
          title: Generationcost
        validUntil:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Validuntil
        energyBalance:
          type: string
          title: Energybalance
        budgetDelta:
          type: string
          title: Budgetdelta
        lastOperationIdpk:
          anyOf:
          - type: string
          - type: 'null'
          title: Lastoperationidpk
        reportDueAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Reportdueat
        reportSentAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Reportsentat
        reportedBudget:
          anyOf:
          - type: string
          - type: 'null'
          title: Reportedbudget
        reportedEnergy:
          anyOf:
          - type: string
          - type: 'null'
          title: Reportedenergy
        reportError:
          anyOf:
          - type: string
          - type: 'null'
          title: Reporterror
      type: object
      required:
      - cycleId
      - opened
      - generationCapacity
      - consumption
      - generationCost
      - validUntil
      - energyBalance
      - budgetDelta
      - lastOperationIdpk
      - reportDueAt
      - reportSentAt
      - reportedBudget
      - reportedEnergy
      - reportError
      title: CycleOut
    DemandEventOut:
      properties:
        id:
          type: integer
          title: Id
        idpk:
          type: string
          title: Idpk
        type:
          type: string
          title: Type
        receivedAt:
          type: string
          format: date-time
          title: Receivedat
        packageBody:
          $ref: '#/components/schemas/PackageBody'
      type: object
      required:
      - id
      - idpk
      - type
      - receivedAt
      - packageBody
      title: DemandEventOut
      description: Evento tal como lo devuelve la API, con todos los campos guardados (RF1).
    DemandItem:
      properties:
        city:
          type: string
          title: City
        demand:
          type: number
          title: Demand
        unit:
          type: string
          title: Unit
      type: object
      required:
      - city
      - demand
      - unit
      title: DemandItem
      description: Demanda de una ciudad dentro de un evento demand-set.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LedgerEventOut:
      properties:
        idpk:
          type: string
          title: Idpk
        kind:
          type: string
          title: Kind
        energyDelta:
          type: string
          title: Energydelta
        budgetDelta:
          type: string
          title: Budgetdelta
        appliedAt:
          type: string
          format: date-time
          title: Appliedat
        isLast:
          type: boolean
          title: Islast
        message:
          additionalProperties: true
          type: object
          title: Message
      type: object
      required:
      - idpk
      - kind
      - energyDelta
      - budgetDelta
      - appliedAt
      - isLast
      - message
      title: LedgerEventOut
      description: Una operación aplicada al ledger dentro de un ciclo.
    MessageLogEntry:
      properties:
        id:
          type: integer
          title: Id
        category:
          type: string
          title: Category
        idpk:
          anyOf:
          - type: string
          - type: 'null'
          title: Idpk
        msgId:
          anyOf:
          - type: string
          - type: 'null'
          title: Msgid
        messageType:
          anyOf:
          - type: string
          - type: 'null'
          title: Messagetype
        cycleId:
          anyOf:
          - type: string
          - type: 'null'
          title: Cycleid
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        rawContent:
          type: string
          title: Rawcontent
        receivedAt:
          type: string
          format: date-time
          title: Receivedat
      type: object
      required:
      - id
      - category
      - idpk
      - msgId
      - messageType
      - cycleId
      - reason
      - rawContent
      - receivedAt
      title: MessageLogEntry
    MessageLogPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/MessageLogEntry'
          type: array
          title: Items
        page:
          type: integer
          title: Page
        limit:
          type: integer
          title: Limit
        total:
          type: integer
          title: Total
        pages:
          type: integer
          title: Pages
      type: object
      required:
      - items
      - page
      - limit
      - total
      - pages
      title: MessageLogPage
    NegotiationIn:
      properties:
        direction:
          type: string
          enum:
          - give
          - take
          title: Direction
        quantity:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
          title: Quantity
        pricePerEnergy:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
          - type: 'null'
          title: Priceperenergy
      type: object
      required:
      - direction
      - quantity
      title: NegotiationIn
      description: Propuesta que crea el administrador. Sin precio, se oferta el tope del ciclo.
    NegotiationOut:
      properties:
        id:
          type: integer
          title: Id
        idpk:
          type: string
          title: Idpk
        cycleId:
          type: string
          title: Cycleid
        direction:
          type: string
          title: Direction
        quantity:
          type: string
          title: Quantity
        pricePerEnergy:
          type: string
          title: Priceperenergy
        state:
          type: string
          title: State
        attempts:
          type: integer
          title: Attempts
        confirmedEnergy:
          anyOf:
          - type: string
          - type: 'null'
          title: Confirmedenergy
        confirmedPrice:
          anyOf:
          - type: string
          - type: 'null'
          title: Confirmedprice
        amount:
          anyOf:
          - type: string
          - type: 'null'
          title: Amount
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
      type: object
      required:
      - id
      - idpk
      - cycleId
      - direction
      - quantity
      - pricePerEnergy
      - state
      - attempts
      - confirmedEnergy
      - confirmedPrice
      - amount
      - reason
      - createdAt
      - updatedAt
      title: NegotiationOut
    PackageBody:
      properties:
        demands:
          items:
            $ref: '#/components/schemas/DemandItem'
          type: array
          title: Demands
        validUntil:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Validuntil
        metaContent:
          anyOf:
          - type: string
          - type: 'null'
          title: Metacontent
        constraints:
          additionalProperties: true
          type: object
          title: Constraints
      type: object
      required:
      - demands
      title: PackageBody
      description: Cuerpo del evento tal como lo publica la central.
    PaginatedHistory:
      properties:
        items:
          items:
            $ref: '#/components/schemas/DemandEventOut'
          type: array
          title: Items
        page:
          type: integer
          title: Page
        limit:
          type: integer
          title: Limit
