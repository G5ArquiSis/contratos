openapi: 3.1.0
info:
  title: EnergyShark E2 API
  version: 2.0.0
  description: |
    API HTTP pública del nodo de Talca (TAL). La interfaz la consume solo a través de API
    Gateway (`https://api.melchort.me`), que exige un JWT de Auth0 y agrega los headers CORS.

    - RF01: `/cycles` y `/cycles/{cycle_id}`
    - RF02: `/connectivity`
    - RF04: `/strategy`, `/strategy/offer` y `/strategy/swaps`
    - E1: `/negotiations` (POST retirado en protocolo v3)
    - AD5: `/wallet/balance-status` (saldo oficial y conciliación de Wallet)
    - RF05: `/message-log`
    - RF02 (E2): `/market/book`; motor comprador: `/market/bids`
    - RF06: `/experiments/span`
    - E0: `/history`

    Los endpoints `/internal/*` (contrato entre connector y master) quedan fuera de este archivo:
    están documentados en `backend/docs/ciclo-negociacion.md` y Nginx los bloquea.

    Archivo generado con `backend/scripts/exportar_openapi.py`; no se edita a mano.
paths:
  /health:
    get:
      tags:
      - health
      summary: Estado del servicio
      description: |-
        Responde 200 solo si el servicio puede hablar con Postgres.

        No consulta al broker a propósito: master debe seguir reportándose sano y
        atendiendo el historial aunque RabbitMQ esté caído (RNF1).
      operationId: read_health_health_get
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Read Health Health Get
      security: []
  /history:
    get:
      tags:
      - history
      summary: Historial de demand-set de la E0, paginado y filtrable
      description: |-
        Historial paginado y filtrable (RF1, RF3, RF4).

        Ambos modelos se declaran con Depends() y no con Query(): FastAPI expande un
        solo modelo Query() por endpoint, y con dos dejaría de publicar `page`,
        `limit` y los filtros como parámetros sueltos.
      operationId: list_history_history_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      - name: idpk
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idpk
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
      - name: receivedAt
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Receivedat
      - name: validUntil
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Validuntil
      - name: city
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: City
      - name: unit
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHistory'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
  /history/{event_id}:
    get:
      tags:
      - history
      summary: Detalle de un evento demand-set de la E0
      description: |-
        Detalle de un evento por el id generado por el sistema (RF2).

        Responde 404 si el id no existe.
      operationId: read_history_entry_history__event_id__get
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
          title: Event Id
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandEventOut'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
        '404':
          description: Evento no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /negotiations:
    post:
      tags:
      - negotiations
      summary: 'Retirado en el protocolo v3: siempre responde 410'
      description: El protocolo v3 retira la creación HTTP de negociaciones E1.
      operationId: propose_negotiation_negotiations_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NegotiationIn'
      responses:
        '410':
          description: 'Siempre: negotiation-proposal está retirado en el protocolo v3'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
    get:
      tags:
      - negotiations
      summary: Historial de negociaciones (RF04)
      description: 'Historial de negociaciones con su estado: pending, confirmed, paid, expired o rejected.'
      operationId: list_negotiation_history_negotiations_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NegotiationOut'
                title: Response List Negotiation History Negotiations Get
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
  /negotiations/{negotiation_id}:
    get:
      tags:
      - negotiations
      summary: Detalle de una negociación (RF04)
      operationId: read_negotiation_negotiations__negotiation_id__get
      parameters:
      - name: negotiation_id
        in: path
        required: true
        schema:
          type: integer
          title: Negotiation Id
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NegotiationOut'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
        '404':
          description: Negociación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /cycles:
    get:
      tags:
      - negotiations
      summary: Ciclos con su balance y el presupuesto actual (RF01)
      description: Ciclos del más reciente al más antiguo, con su balance y el presupuesto actual.
      operationId: list_cycle_ledger_cycles_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleList'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
  /cycles/{cycle_id}:
    get:
      tags:
      - negotiations
      summary: Historial completo de un ciclo (RF01)
      description: |-
        Historial de un ciclo (RF01): lo recibido, lo negociado, lo reportado y los balances.

        `operations` trae todo en el orden en que se aplicó; la última lleva
        `isLast: true`, y su idpk se repite en `lastOperationIdpk`.
      operationId: read_cycle_cycles__cycle_id__get
      parameters:
      - name: cycle_id
        in: path
        required: true
        schema:
          type: string
          title: Cycle Id
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleDetail'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
        '404':
          description: Ciclo no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /connectivity:
    get:
      tags:
      - negotiations
      summary: Distance-table vigente (RF02)
      description: |-
        La distance-table vigente (RF02): destino, distancia, costo de transporte y estado.

        Refleja la última que publicó la central. Antes de la primera, responde una
        lista vacía en vez de 404: la interfaz muestra "sin datos", no un error.
      operationId: read_connectivity_connectivity_get
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connectivity'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
  /message-log:
    get:
      tags:
      - negotiations
      summary: Mensajes duplicados, descartados o con NACK (RF05)
      description: |-
        Mensajes duplicados, descartados y respondidos con NACK (RF05), paginados.

        Incluye los de otras ciudades (por ejemplo un bid con IDENTITY_MISMATCH): `cityId` es la
        ciudad que el mensaje dice ser y `userId` el user_id AMQP con que llegó.
      operationId: list_unapplied_messages_message_log_get
      parameters:
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - duplicate
            - discarded
            - nack
            type: string
          - type: 'null'
          description: Filtra por tipo de registro
          title: Category
        description: Filtra por tipo de registro
      - name: cityId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 16
          - type: 'null'
          description: Ciudad emisora según el mensaje (cityId), o "central"
          title: Cityid
        description: Ciudad emisora según el mensaje (cityId), o "central"
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Recibidos desde este instante (incluido)
          title: Since
        description: Recibidos desde este instante (incluido)
      - name: until
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Recibidos hasta este instante (incluido)
          title: Until
        description: Recibidos hasta este instante (incluido)
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageLogPage'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
  /wallet/balance-status:
    get:
      tags:
      - negotiations
      summary: Balance oficial de la wallet y su conciliación (AD5)
      description: |-
        este endpoint entrega el ultimo balance oficial sincronizado y el delta detectado.
        decision (AD5).
      operationId: wallet_balance_status_wallet_balance_status_get
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema: {}
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
  /strategy:
    get:
      tags:
      - strategy
      summary: Consultar la estrategia activa (RF04)
      description: Devuelve la estrategia activa y su versión persistida.
      operationId: read_strategy_strategy_get
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyAdminOut'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
    put:
      tags:
      - strategy
      summary: Actualizar la estrategia para el siguiente ciclo (RF04)
      description: Crea una versión nueva con la configuración completa recibida.
      operationId: replace_strategy_strategy_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyConfig-Input'
        required: true
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyAdminOut'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
  /strategy/offer:
    get:
      tags:
      - strategy
      summary: Consultar la configuración de la oferta propia (RF04)
      description: Devuelve los parámetros de precio y cantidad de la oferta propia.
      operationId: read_offer_strategy_strategy_offer_get
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyOfferOut'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
    patch:
      tags:
      - strategy
      summary: Actualizar precio y cantidad de la oferta (RF04)
      description: Actualiza solo los parámetros de oferta, conservando el resto de la estrategia.
      operationId: update_offer_strategy_strategy_offer_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyOfferPatch'
        required: true
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyOfferOut'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
  /strategy/swaps:
    get:
      tags:
      - strategy
      summary: Consultar los swaps propios en curso (RF04)
      description: Lista bids aceptados cuyo swap vendedor todavía no llegó a estado terminal.
      operationId: list_in_progress_swaps_strategy_swaps_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SellerSwapOut'
                title: Response List In Progress Swaps Strategy Swaps Get
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
  /market/book:
    get:
      tags:
      - market
      summary: Libro de ofertas con transporte y precio efectivo (RF02)
      description: Ofertas abiertas de otras ciudades, de la más barata (con transporte) a la más cara.
      operationId: get_market_book_market_book_get
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketBook'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
  /market/bids:
    get:
      tags:
      - market
      summary: Bids de TAL y el estado de su swap (motor comprador)
      description: Bids de TAL, del más reciente al más antiguo, con su estado y el swap asociado.
      operationId: get_market_bids_market_bids_get
      parameters:
      - name: cycleId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cycleid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidList'
        '422':
          description: Parámetros o cuerpo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
  /experiments/span:
    get:
      tags:
      - experiments
      summary: Experimento de span por ciclo y por valor de span (RF06)
      description: |-
        Por ciclo: span usado, déficit cubierto en el mercado, costo efectivo frente al
        baseline (déficit × imbalancePrice) y bids rechazados; y lo mismo agregado por span.
      operationId: get_span_experiment_experiments_span_get
      responses:
        '200':
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpanExperiment'
        '401':
          description: Falta el token de Auth0 o no es válido (lo responde API Gateway)
components:
  schemas:
    BidList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BidOut'
          type: array
          title: Items
      type: object
      required:
      - items
      title: BidList
    BidOut:
      properties:
        id:
          type: integer
          title: Id
        idpk:
          type: string
          title: Idpk
        cycleId:
          type: string
          title: Cycleid
        offerId:
          type: string
          title: Offerid
        seller:
          type: string
          title: Seller
        quantity:
          type: string
          title: Quantity
        pricePerEnergy:
          type: string
          title: Priceperenergy
        transportPerEnergy:
          type: string
          title: Transportperenergy
        state:
          type: string
          title: State
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        attempts:
          type: integer
          title: Attempts
        spanSeconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Spanseconds
        swapId:
          anyOf:
          - type: string
          - type: 'null'
          title: Swapid
        swapAmount:
          anyOf:
          - type: string
          - type: 'null'
          title: Swapamount
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
      type: object
      required:
      - id
      - idpk
      - cycleId
      - offerId
      - seller
      - quantity
      - pricePerEnergy
      - transportPerEnergy
      - state
      - reason
      - attempts
      - spanSeconds
      - swapId
      - swapAmount
      - createdAt
      - updatedAt
      title: BidOut
    BookOffer:
      properties:
        offerId:
          type: string
          title: Offerid
        cityId:
          type: string
          title: Cityid
        quantity:
          anyOf:
          - type: string
          - type: 'null'
          title: Quantity
        remaining:
          type: string
          title: Remaining
        pricePerEnergy:
          type: string
          title: Priceperenergy
        distanceKm:
          anyOf:
          - type: string
          - type: 'null'
          title: Distancekm
        transportPerEnergy:
          anyOf:
          - type: string
          - type: 'null'
          title: Transportperenergy
        effectivePrice:
          anyOf:
          - type: string
          - type: 'null'
          title: Effectiveprice
        routeEnabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Routeenabled
        worthBuying:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Worthbuying
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
      type: object
      required:
      - offerId
      - cityId
      - quantity
      - remaining
      - pricePerEnergy
      - distanceKm
      - transportPerEnergy
      - effectivePrice
      - routeEnabled
      - worthBuying
      - updatedAt
      title: BookOffer
      description: Una oferta de otra ciudad con lo que le cuesta a TAL comprarla.
    Connection:
      properties:
        destination:
          type: string
          title: Destination
        distance:
          anyOf:
          - type: number
          - type: 'null'
          title: Distance
        transportCost:
          anyOf:
          - type: number
          - type: 'null'
          title: Transportcost
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
      type: object
      required:
      - destination
      - distance
      - transportCost
      - enabled
      title: Connection
      description: Ruta hacia otra ciudad, según la distance-table vigente.
    Connectivity:
      properties:
        updatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updatedat
        connections:
          items:
            $ref: '#/components/schemas/Connection'
          type: array
          title: Connections
      type: object
      required:
      - updatedAt
      - connections
      title: Connectivity
      description: La distance-table vigente; `updatedAt` es nulo si la central aún no envió ninguna.
    CycleBalances:
      properties:
        energy:
          type: string
          title: Energy
        budget:
          type: string
          title: Budget
      type: object
      required:
      - energy
      - budget
      title: CycleBalances
      description: 'Balances finales del ciclo: la energía es propia; el presupuesto viene acumulado.'
    CycleDetail:
      properties:
        cycleId:
          type: string
          title: Cycleid
        opened:
          type: boolean
          title: Opened
        validUntil:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Validuntil
        statusStatement:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Statusstatement
        transfers:
          items:
            $ref: '#/components/schemas/LedgerEventOut'
          type: array
          title: Transfers
        demandStatements:
          items:
            $ref: '#/components/schemas/LedgerEventOut'
          type: array
          title: Demandstatements
        negotiations:
          items:
            $ref: '#/components/schemas/NegotiationOut'
          type: array
          title: Negotiations
